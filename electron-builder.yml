appId: com.expensetrack.app
productName: Expense Track
copyright: "Copyright © 2026 Dunkin Global Advisors"

# No asar — keeps path resolution simple
asar: false

directories:
  output: dist-electron
  buildResources: electron

files:
  # Only the Electron main process files — no node_modules.
  # All server dependencies are bundled into server/index.cjs by esbuild.
  - electron/main.cjs
  - electron/preload.cjs
  - electron/icon.png
  - package.json
  # Explicitly exclude everything else
  - "!node_modules/**"
  - "!dist/**"
  - "!src/**"
  - "!client/**"
  - "!server/**"
  - "!shared/**"
  - "!script/**"

extraResources:
  # Fully self-contained Express server bundle (all JS deps inlined by esbuild)
  - from: dist/index.cjs
    to: server/index.cjs
  # Native SQLite binary — vendored Windows x64 prebuild for Electron 41 (ABI 145).
  # Source: https://github.com/WiseLibs/better-sqlite3/releases/tag/v12.9.0
  # File:   better-sqlite3-v12.9.0-electron-v145-win32-x64.tar.gz
  # Vendored explicitly so the Windows zip can be built from any host (Linux,
  # macOS, Windows) without producing a Linux/macOS .node by accident.
  - from: build/native-win-x64/better_sqlite3.node
    to: native/better_sqlite3.node
  # Built React frontend
  - from: dist/public
    to: public

win:
  # NSIS installer creates a proper Start Menu shortcut with the AUMI embedded
  # in the .lnk file at install time — this is the correct fix for the pinned
  # taskbar icon routing to TimeTrack when both apps are running.
  #
  # A plain ZIP shortcut created by dragging to the taskbar does NOT embed the
  # AUMI, so Windows falls back to matching by FileDescription/ProductName.
  # Even with version strings embedded via rcedit, the shell can still mis-route
  # the click if another Electron process is already running.  NSIS eliminates
  # this ambiguity entirely.
  target:
    - target: nsis
      arch: [x64]
  icon: electron/icon.ico
  artifactName: "ExpenseTrack-${version}-Windows-x64-Setup.exe"
  # Prevent electron-builder from running rcedit itself — our afterPack hook
  # handles icon + version-string embedding explicitly.
  signAndEditExecutable: false
  # Code signing — self-signed certificate
  # Publisher: Ann Dunkin / Dunkin Global Advisors
  # Certificate valid through April 2031
  # Set CSC_LINK to path of build/signing.pfx before building
  # Set CSC_KEY_PASSWORD to the pfx passphrase (empty string for no passphrase)
  # e.g.:  CSC_LINK=build/signing.pfx CSC_KEY_PASSWORD="" npx electron-builder --win --x64
  #
  # If CSC_LINK is not set, signing is skipped automatically (forceCodeSigning: false)
  forceCodeSigning: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  # Default install to %LOCALAPPDATA% (no admin rights needed)
  # Override by setting allowToChangeInstallationDirectory: true if preferred
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Expense Track"
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  installerHeaderIcon: electron/icon.ico
  deleteAppDataOnUninstall: false

# afterPack hook: embeds custom icon + version strings into the exe via rcedit+Wine.
# Version strings (FileDescription, ProductName, etc.) ensure Windows Shell can
# uniquely identify Expense Track even when falling back from AUMI matching.
afterPack: ./build/afterPack.cjs

publish: null
nodeGypRebuild: false
buildDependenciesFromSource: false
npmRebuild: false

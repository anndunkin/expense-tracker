name: Build & Release

# Triggers on any tag matching v* (e.g. v1.0.0, v1.1.3)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-and-release:
    name: Build Windows x64 and publish release
    runs-on: windows-latest   # must be Windows to compile better-sqlite3 for the Electron ABI and build the NSIS installer

    steps:
      # ── 1. Checkout full history so the tag commit is available ──────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Refresh the vendored prebuilt better-sqlite3 binary ────────────────
      # electron-builder.yml has nodeGypRebuild/npmRebuild disabled and instead
      # copies build/native-win-x64/better_sqlite3.node via extraResources. That
      # vendored file was previously built for Electron ABI 145 (Electron 41) and
      # is now stale for Electron 43.4.0 (ABI 148). better-sqlite3's official
      # prebuilds only cover up to ABI 146 (Electron 42), so we compile it fresh
      # here on a real Windows runner and overwrite the vendored copy before
      # packaging.
      - name: Rebuild better-sqlite3 for Electron and refresh vendored binary
        shell: bash
        run: |
          npx electron-rebuild -f -w better-sqlite3
          mkdir -p build/native-win-x64
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node build/native-win-x64/better_sqlite3.node
          echo "Refreshed build/native-win-x64/better_sqlite3.node for Electron 43 (ABI 148)"

      # ── 5. Type-check (no automated test suite exists for this app) ──────────
      - name: Type-check
        run: npm run check

      # ── 6. Build client + server bundle (esbuild + vite) ─────────────────────
      - name: Build
        run: npm run build

      # ── 7. Package with electron-builder (nsis) ──────────────────────────────
      - name: Package Windows installer
        run: npx electron-builder --config electron-builder.yml --win --x64 --publish never
        env:
          # No signing certificate configured in CI — produces a valid unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── 8. Extract version from tag (strips leading 'v') ─────────────────────
      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 9. Locate build artifacts ─────────────────────────────────────────────
      - name: Locate artifacts
        id: artifacts
        shell: bash
        run: |
          EXE=$(ls dist-electron/*.exe 2>/dev/null | head -1)
          echo "EXE=$EXE" >> "$GITHUB_OUTPUT"
          echo "Found EXE: $EXE"

      # ── 10. Extract release notes for this version from CHANGELOG.md ──────────
      - name: Extract release notes
        id: release_notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Expense Track v$VERSION"
          fi
          echo "$NOTES" > release_notes.txt
          cat release_notes.txt

      # ── 11. Create GitHub Release and upload assets ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Expense Track v${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          files: |
            ${{ steps.artifacts.outputs.EXE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
